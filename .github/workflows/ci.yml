name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    # 'claude/**': los PR apilados (F1 sobre F0, F2 sobre F1…) también corren
    # el CI, con el paso estricto diffeado contra su rama base real.
    branches: [main, master, develop, 'claude/**']
  workflow_dispatch:

# Cancela jobs viejos cuando se hace un push nuevo a la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historia completa: el paso «Reglas estrictas en código tocado»
          # necesita el merge-base contra la rama destino.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.13

      - name: Ruff check
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

      # Trinquete por archivo (F0.8): la deuda heredada se tolera donde ya
      # está (pyproject silencia esas reglas), pero el código que un PR toca
      # cumple las reglas estrictas completas. Para scripts/ se excluye T201:
      # imprimen a propósito. Solo en pull_request: ahí la rama destino
      # (base_ref) define «lo tocado»; en push o workflow_dispatch no hay
      # destino y diffear contra main lintaría toda la divergencia.
      - name: Reglas estrictas en código tocado
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          # ':(glob)' es necesario: sin él, 'scripts/**/*.py' no casa con
          # archivos directamente bajo scripts/ (pathspec de git).
          # Asignación y no sustitución de proceso (`< <(...)`): si `git diff`
          # falla, `set -e` aborta aquí en vez de seguir con una lista vacía y
          # pasar en vacío.
          LISTA=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" \
            -- ':(glob)src/**/*.py' ':(glob)scripts/**/*.py')
          if [ -z "$LISTA" ]; then
            echo "Sin archivos .py tocados en src/ ni scripts/ respecto a origin/$BASE."
            exit 0
          fi
          mapfile -t TOCADOS <<< "$LISTA"
          printf 'Archivos tocados (%d):\n' "${#TOCADOS[@]}"
          printf '   %s\n' "${TOCADOS[@]}"
          EN_SRC=(); EN_SCRIPTS=()
          for f in "${TOCADOS[@]}"; do
            case "$f" in
              src/*) EN_SRC+=("$f") ;;
              scripts/*) EN_SCRIPTS+=("$f") ;;
            esac
          done
          if [ "${#EN_SRC[@]}" -gt 0 ]; then
            ruff check --isolated --select PTH,BLE001,E722,T201,C901 \
              --config "lint.mccabe.max-complexity=15" "${EN_SRC[@]}"
          fi
          if [ "${#EN_SCRIPTS[@]}" -gt 0 ]; then
            ruff check --isolated --select PTH,BLE001,E722,C901 \
              --config "lint.mccabe.max-complexity=15" "${EN_SCRIPTS[@]}"
          fi

  typecheck:
    name: Type check debt (mypy, visible)
    runs-on: ubuntu-latest
    # No bloquea CI mientras la deuda técnica del notebook se refactore.
    # Cuando 0.7.0+ tenga mypy clean, mover a needs: [lint, typecheck] en build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and typing tools
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy --config-file=pyproject.toml src/record_linkage/

  typecheck-core:
    name: Type check core (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and typing tools
        run: pip install -e ".[dev]"

      - name: Mypy on hardened production ring
        run: |
          mypy --config-file=pyproject.toml \
            src/record_linkage/api.py \
            src/record_linkage/config \
            src/record_linkage/exporters \
            src/record_linkage/ingestion \
            src/record_linkage/matching/motor_bloqueo.py \
            src/record_linkage/matching/normalizadores.py \
            src/record_linkage/matching/pipeline_integration.py \
            src/record_linkage/pipeline/fingerprints.py \
            src/record_linkage/pipeline/orchestrator.py \
            src/record_linkage/pipeline/state_manager.py \
            src/record_linkage/utils

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coherencia de versión (pyproject == CHANGELOG == instalada)
        run: python scripts/verificar_coherencia_version.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            -m "not canario and not slow" \
            --cov=record_linkage \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Upload coverage to Codecov
        # Solo en Python 3.11 (matriz principal) y solo si el secret existe.
        # Si no hay token de Codecov, el step se salta sin fallar.
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # no romper CI si Codecov falla
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Verify importability of all submodules
        run: |
          python -c "
          import pkgutil, importlib
          import record_linkage
          errors = []
          for finder, name, ispkg in pkgutil.walk_packages(
              record_linkage.__path__, prefix='record_linkage.'
          ):
              try:
                  importlib.import_module(name)
              except Exception as e:
                  errors.append(f'{name}: {type(e).__name__}: {e}')
          if errors:
              print('IMPORT FAILURES:')
              for e in errors:
                  print(f'  - {e}')
              exit(1)
          print(f'All submodules import OK')
          "

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reject high-severity static findings
        run: bandit -q -r src -lll

      - name: Audit installed dependency graph
        run: pip-audit

  deuda:
    name: Trinquete de deuda (no sube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and tools (ruff, mypy)
        run: pip install -e ".[dev]"

      # Mide cc_ge_20 / except_sin_relanzar / print / os_path / mypy sobre
      # src/record_linkage y falla si CUALQUIER conteo supera la referencia.
      # Si baja, el script pide actualizar docs/evidencia/deuda_f0.json.
      - name: La deuda no sube respecto a docs/evidencia/deuda_f0.json
        run: python scripts/deuda.py --referencia docs/evidencia/deuda_f0.json

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, typecheck-core, test, security, deuda]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Smoke-test the built wheel in an isolated environment
        run: |
          python -m venv /tmp/rues-wheel-smoke
          /tmp/rues-wheel-smoke/bin/pip install dist/*.whl
          # La versión esperada sale del pyproject: el 0.16.0 fijo a mano habría
          # fallado en cuanto el job llegara a correr (0.23.0).
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          /tmp/rues-wheel-smoke/bin/python -I scripts/smoke_installed_release.py --expected-version "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          retention-days: 14
