# Nightly (F0.5): instala dependencias FRESCAS (rangos de pyproject, sin
# constraints) y corre la suite COMPLETA (incluye slow: baseline + canario).
# Propósito: detectar deriva de dependencias el día que ocurre, no el día
# que bloquea una publicación (lección datasketch 2.0, CHANGELOG [0.7.6]).
name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 02:00 Bogotá
  workflow_dispatch: {}

jobs:
  suite-completa:
    name: Suite completa con dependencias frescas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (rangos frescos, sin constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip list --format=freeze | sort
      - name: Coherencia de versión
        run: python scripts/verificar_coherencia_version.py
      - name: Suite completa (incluye slow)
        run: pytest tests/ -q --tb=short
