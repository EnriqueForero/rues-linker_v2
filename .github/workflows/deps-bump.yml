# Bump mensual de dependencias, GATEADO (F0.2): sube las dependencias a lo
# último que permiten los rangos de pyproject, corre la suite completa y, si
# está verde, abre un PR con el constraints regenerado. Los saltos de versión
# se descubren en un PR controlado, no en una publicación bloqueada.
#
# Requisito del repo: Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests".
name: Deps bump mensual

on:
  schedule:
    - cron: "0 6 1 * *"   # día 1 de cada mes
  workflow_dispatch: {}

jobs:
  bump-y-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolver lock transitivo con hashes
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile pyproject.toml \
            --upgrade \
            --resolver=backtracking \
            --strip-extras \
            --generate-hashes \
            --output-file=constraints/runtime-validado.txt
      - name: Instalar exactamente el candidato de runtime
        run: |
          pip install -e ".[dev]" -c constraints/runtime-validado.txt
          python -m pip check
      - name: Gate completo sobre el lock candidato (incluye slow)
        run: pytest tests/ -q --tb=short -m "not canario"
      - name: Abrir PR con el bump validado
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: deps/bump-mensual
          commit-message: "chore(deps): bump mensual gateado (suite verde)"
          title: "Deps bump mensual — suite completa verde"
          body: |
            Bump automático dentro de los rangos de `pyproject.toml`.
            El gate completo (suite entera, incluye slow) corrió VERDE con
            estas versiones antes de abrir este PR. Revise el diff de
            `constraints/runtime-validado.txt` y mezcle si está de acuerdo.
          add-paths: constraints/runtime-validado.txt
