name: Publish candidate to TestPyPI

on:
  workflow_dispatch:

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Gate and publish candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rues-linker
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints/runtime-validado.txt
          python -m pip check

      - name: Candidate quality gate
        run: |
          python scripts/verificar_coherencia_version.py
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/
          mypy --config-file=pyproject.toml \
            src/record_linkage/api.py \
            src/record_linkage/config \
            src/record_linkage/exporters \
            src/record_linkage/ingestion \
            src/record_linkage/matching/motor_bloqueo.py \
            src/record_linkage/matching/normalizadores.py \
            src/record_linkage/matching/pipeline_integration.py \
            src/record_linkage/pipeline/fingerprints.py \
            src/record_linkage/pipeline/orchestrator.py \
            src/record_linkage/pipeline/state_manager.py \
            src/record_linkage/utils
          bandit -q -r src -lll
          pip-audit
          pytest tests/ -q --tb=short -m "not canario and not slow" \
            --cov=record_linkage --cov-report=term --cov-fail-under=60

      - name: Build and verify
        run: |
          python -m build
          twine check dist/*

      - name: Publish only to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
